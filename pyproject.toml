[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-attendance"
version = "0.1.0"
description = "Local face enrollment, recognition, and institutional attendance management"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "alembic==1.15.2", "pydantic-settings==2.8.1", "email-validator==2.2.0",
  "argon2-cffi==23.1.0", "cryptography==44.0.2", "python-multipart==0.0.20",
  "httpx==0.28.1", "streamlit==1.44.1", "streamlit-webrtc==0.62.4",
  "av==16.0.1", "numpy==1.26.4", "pandas==2.2.3", "pyarrow==19.0.1", "plotly==6.0.1",
  "opencv-contrib-python==4.11.0.86", "mediapipe==0.10.32",
  "facenet-pytorch==2.6.0", "torch==2.2.2", "torchvision==0.17.2",
  "pillow==10.2.0", "scikit-learn==1.6.1", "pynndescent==0.5.13",
  "numba==0.61.2", "xlsxwriter==3.2.2", "reportlab==4.3.1",
  "psycopg[binary]==3.2.6",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.5", "nbformat==5.10.4", "ipykernel==6.29.5", "notebook==7.4.0"]

[project.scripts]
attendance = "scripts.manage:main"

[tool.setuptools.packages.find]
include = ["backend*", "vision*", "frontend*", "scripts*"]

[tool.setuptools.package-data]
frontend = ["components/session/*.html"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]
